name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Build
        run: go build ./...

      - name: Unit tests
        run: go test ./internal/... ./pkg/... -timeout 3m -v

      - name: Comparison metric tests
        run: go test ./tests/comparison/... -run TestMetrics -timeout 1m -v
